<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AURA.OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg2:#111118; --bg3:#1a1a24; --surface:rgba(20,20,30,0.8); --border:rgba(255,255,255,0.08); --tp:#f1f5f9; --ts:#94a3b8; --tt:#64748b; --ap:#8b5cf6; --apl:rgba(139,92,246,0.12); --ad:#7c3aed; --danger:#ef4444; --success:#10b981; }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; color:var(--tp); padding:20px; }
    body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 600px 400px at 20% 15%, rgba(139,92,246,0.12), transparent 70%), linear-gradient(160deg,#0c0c16,#0a0a0f 40%,#0e0e18); z-index:-2; }
    .card { width:100%; max-width:420px; background:var(--surface); backdrop-filter:blur(24px); border:1px solid var(--border); border-radius:24px; padding:40px 36px; }
    .logo { font-size:22px; font-weight:800; background:linear-gradient(135deg,#3b82f6,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-align:center; margin-bottom:32px; }
    .title { font-size:22px; font-weight:700; text-align:center; margin-bottom:8px; }
    .subtitle { font-size:12.5px; color:var(--ts); text-align:center; margin-bottom:28px; }
    .fg { margin-bottom:18px; }
    .fl { display:block; font-size:11px; font-weight:700; color:var(--ts); text-transform:uppercase; margin-bottom:8px; }
    .fi { width:100%; height:48px; background:var(--bg3); border:1px solid var(--border); border-radius:12px; padding:0 16px 0 42px; color:var(--tp); font-family:'Inter'; font-size:13.5px; outline:none; }
    .fi:focus { border-color:var(--ap); }
    .iw { position:relative; }
    .iw > i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--tt); font-size:13px; }
    .btn { width:100%; height:48px; border:none; border-radius:12px; font-weight:600; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px; }
    .btn-reg { background:linear-gradient(135deg,var(--ap),var(--ad)); color:#fff; }
    .btn-back { background:transparent; color:var(--ts); border:1px solid var(--border); margin-top:12px; font-size:13px; text-decoration:none; }
    .msg { font-size:12.5px; padding:12px 16px; border-radius:10px; margin-bottom:18px; display:none; }
    .msg.err { display:block; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:var(--danger); }
    .msg.ok { display:block; background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3); color:var(--success); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">AURA.OS</div>
    <div class="title">Register</div>
    <div class="subtitle">Buat akun baru untuk mengakses AURA.OS</div>

    <div class="msg" id="regMsg"></div>

    <form onsubmit="doRegister(event)">
      <div class="fg">
        <label class="fl">Username</label>
        <div class="iw"><i class="fas fa-user"></i>
          <input type="text" id="regUsername" class="fi" placeholder="Pilih username" required>
        </div>
      </div>
      <div class="fg">
        <label class="fl">Password</label>
        <div class="iw"><i class="fas fa-lock"></i>
          <input type="password" id="regPassword" class="fi" placeholder="Pilih password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-reg" id="regBtn"><i class="fas fa-user-plus"></i> Daftar Sekarang</button>
    </form>

    <a href="/Login.html" class="btn btn-back"><i class="fas fa-arrow-left"></i> Kembali ke Login</a>
  </div>

  <script>
    // Blokir akses langsung jika registrasi ditutup
    fetch('/api/settings/registration/public')
      .then(r => r.ok ? r.json() : null)
      .then(s => {
        if (s && s.open === false) {
          document.body.innerHTML = '<div class="card" style="text-align:center;"><div class="logo">AURA.OS</div><div class="title">🔒</div><div class="subtitle">Pendaftaran sedang ditutup oleh Admin.</div><a href="/Login.html" class="btn btn-back" style="max-width:200px; margin:20px auto 0;">Kembali ke Login</a></div>';
        }
      })
      .catch(() => {});

    async function doRegister(e) {
      e.preventDefault();
      const msg = document.getElementById('regMsg');
      const btn = document.getElementById('regBtn');
      msg.className = 'msg';

      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mendaftar...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('regUsername').value.trim(),
            password: document.getElementById('regPassword').value
          })
        });
        const data = await res.json();

        if (data.success) {
          if (data.pending) {
            msg.className = 'msg ok';
            msg.textContent = '✅ Pendaftaran berhasil! Akun Anda menunggu persetujuan admin.';
          } else {
            msg.className = 'msg ok';
            msg.textContent = '✅ Pendaftaran berhasil! Mengalihkan ke login...';
            setTimeout(() => window.location.href = '/Login.html', 2000);
          }
        } else {
          msg.className = 'msg err';
          msg.textContent = data.error || 'Pendaftaran gagal!';
        }
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = 'Kesalahan koneksi ke server';
      } finally {
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Daftar Sekarang';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
