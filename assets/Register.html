<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AURA.OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg2:#111118; --bg3:#1a1a24; --surface:rgba(20,20,30,0.8); --border:rgba(255,255,255,0.08); --tp:#f1f5f9; --ts:#94a3b8; --tt:#64748b; --ap:#8b5cf6; --apl:rgba(139,92,246,0.12); --ad:#7c3aed; --danger:#ef4444; --success:#10b981; }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; color:var(--tp); padding:20px; }
    body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 600px 400px at 20% 15%, rgba(139,92,246,0.12), transparent 70%), linear-gradient(160deg,#0c0c16,#0a0a0f 40%,#0e0e18); z-index:-2; }
    .card { width:100%; max-width:420px; background:var(--surface); backdrop-filter:blur(24px); border:1px solid var(--border); border-radius:24px; padding:40px 36px; }
    .logo { font-size:22px; font-weight:800; background:linear-gradient(135deg,#3b82f6,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-align:center; margin-bottom:32px; }
    .title { font-size:22px; font-weight:700; text-align:center; margin-bottom:8px; }
    .subtitle { font-size:12.5px; color:var(--ts); text-align:center; margin-bottom:28px; }
    .fg { margin-bottom:18px; }
    .fl { display:block; font-size:11px; font-weight:700; color:var(--ts); text-transform:uppercase; margin-bottom:8px; }
    .fi { width:100%; height:48px; background:var(--bg3); border:1px solid var(--border); border-radius:12px; padding:0 16px 0 42px; color:var(--tp); font-family:'Inter'; font-size:13.5px; outline:none; }
    .fi:focus { border-color:var(--ap); }
    .iw { position:relative; }
    .iw > i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--tt); font-size:13px; }
    .btn { width:100%; height:48px; border:none; border-radius:12px; font-weight:600; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px; }
    .btn-reg { background:linear-gradient(135deg,var(--ap),var(--ad)); color:#fff; }
    .btn-back { background:transparent; color:var(--ts); border:1px solid var(--border); margin-top:12px; font-size:13px; text-decoration:none; }
    /* ===== CENTER-SCREEN CARD MODAL (notification) ===== */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; padding: 20px; }
    .modal-overlay.show { opacity: 1; visibility: visible; }
    .modal-card { position: relative; width: 400px; max-width: 100%; padding: 40px 36px 32px; background: rgba(20,20,30,0.95); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(239,68,68,0.18); text-align: center; color: var(--tp); transform: scale(0.9); opacity: 0; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease, box-shadow 0.3s ease; overflow: hidden; }
    .modal-overlay.show .modal-card { transform: scale(1); opacity: 1; }
    .modal-accent { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #3b82f6, #8b5cf6); z-index: 1; }
    .modal-loading-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #3b82f6, #8b5cf6, transparent); background-size: 200% 100%; animation: loading-shimmer 1.5s ease-in-out infinite; box-shadow: 0 0 12px rgba(139, 92, 246, 0.6); z-index: 2; }
    /* ===== FX LOADER SPINNER (dual-ring purple/pink) ===== */
    .fx-loader-spinner { position: relative; width: 56px; height: 56px; border-radius: 50%; border: 3px solid transparent; border-top-color: #8b5cf6; border-right-color: #8b5cf6; animation: fx-spin 1s linear infinite; margin: 4px auto 20px; }
    .fx-loader-spinner span { position: absolute; inset: 6px; border-radius: 50%; border: 3px solid transparent; border-bottom-color: #ec4899; border-left-color: #ec4899; animation: fx-spin 0.7s linear reverse infinite; }
    @keyframes fx-spin { to { transform: rotate(360deg); } }
    .modal-card.alert-loading .modal-icon { display: none; }
    .modal-card.alert-loading .fx-loader-spinner { display: block; }
    .modal-card .fx-loader-spinner { display: none; }
    @keyframes loading-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .modal-close { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border: none; background: rgba(255,255,255,0.06); color: var(--ts); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; font-family: inherit; transition: background 0.2s ease, color 0.2s ease; }
    .modal-close:hover { background: rgba(255,255,255,0.12); color: var(--tp); }
    .modal-icon { width: 80px; height: 80px; margin: 4px auto 20px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; flex-shrink: 0; }
    .modal-card.alert-error .modal-icon { background: rgba(239,68,68,0.12); color: var(--danger); box-shadow: 0 0 30px rgba(239,68,68,0.18); }
    .modal-card.alert-success .modal-icon { background: rgba(16,185,129,0.12); color: var(--success); box-shadow: 0 0 30px rgba(16,185,129,0.18); }
    .modal-card.alert-warning .modal-icon { background: rgba(245,158,11,0.12); color: #f59e0b; box-shadow: 0 0 30px rgba(245,158,11,0.18); }
    .modal-card.alert-info .modal-icon { background: rgba(59,130,246,0.12); color: #3b82f6; box-shadow: 0 0 30px rgba(59,130,246,0.18); }
    .modal-card.alert-error { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(239,68,68,0.28); }
    .modal-card.alert-success { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(16,185,129,0.28); }
    .modal-card.alert-warning { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(245,158,11,0.28); }
    .modal-card.alert-info { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(59,130,246,0.28); }
    .modal-title { font-size: 21px; font-weight: 700; color: var(--tp); margin-bottom: 10px; text-align: center; }
    .modal-desc { font-size: 14.5px; font-weight: 400; color: #94a3b8; line-height: 1.5; text-align: center; margin-bottom: 24px; }
    .modal-btn { width: 100%; height: 48px; border: none; border-radius: 12px; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; font-weight: 600; font-size: 14.5px; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.15s ease, box-shadow 0.2s ease; }
    .modal-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(59,130,246,0.35); }
    .modal-btn:active { transform: translateY(0); }
    @media (max-width: 480px) { .modal-card { padding: 36px 24px 28px; } .modal-icon { width: 72px; height: 72px; font-size: 32px; } .modal-title { font-size: 20px; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">AURA.OS</div>
    <div class="title">Register</div>
    <div class="subtitle">Buat akun baru untuk mengakses AURA.OS</div>

    <form onsubmit="doRegister(event)">
      <div class="fg">
        <label class="fl">Username</label>
        <div class="iw"><i class="fas fa-user"></i>
          <input type="text" id="regUsername" class="fi" placeholder="Pilih username" required>
        </div>
      </div>
      <div class="fg">
        <label class="fl">Password</label>
        <div class="iw"><i class="fas fa-lock"></i>
          <input type="password" id="regPassword" class="fi" placeholder="Pilih password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-reg" id="regBtn"><i class="fas fa-user-plus"></i> Daftar Sekarang</button>
    </form>

    <a href="/Login.html" class="btn btn-back"><i class="fas fa-arrow-left"></i> Kembali ke Login</a>
  </div>

  <!-- ===== CENTER-SCREEN CARD MODAL (notification) — body level so position:fixed is viewport-relative ===== -->
  <div class="modal-overlay" id="regMsg">
    <div class="modal-card alert-error">
      <div class="modal-loading-bar"></div>
      <div class="modal-accent"></div>
      <button type="button" class="modal-close" data-close aria-label="Tutup"><i class="fas fa-xmark"></i></button>
      <div class="modal-icon"><i class="fas fa-circle-xmark" id="regMsgIcon"></i></div>
      <div class="fx-loader-spinner"><span></span></div>
      <h3 class="modal-title" id="regMsgTitle">Pendaftaran Gagal</h3>
      <p class="modal-desc" id="regMsgText"></p>
      <button type="button" class="modal-btn" data-close><i class="fas fa-rotate-right"></i> Coba Lagi</button>
    </div>
  </div>

  <script>
    // ===== AUTO-REDIRECT IF ALREADY LOGGED IN =====
    (function autoRedirectIfAuthed() {
      try {
        var token = localStorage.getItem('aura_auth_token');
        if (token) {
          window.location.replace('/Dashboard.html');
          return;
        }
      } catch (e) {
        console.warn('Auto-redirect check failed:', e);
      }
    })();

    // Blokir akses langsung jika registrasi ditutup
    fetch('/api/settings/registration/public')
      .then(r => r.ok ? r.json() : null)
      .then(s => {
        if (s && s.open === false) {
          document.body.innerHTML = '<div class="card" style="text-align:center;"><div class="logo">AURA.OS</div><div class="title">🔒</div><div class="subtitle">Pendaftaran sedang ditutup oleh Admin.</div><a href="/Login.html" class="btn btn-back" style="max-width:200px; margin:20px auto 0;">Kembali ke Login</a></div>';
        }
      })
      .catch(() => {});

    var regMsgTimer = null;
    var REG_MSG_META = {
      error:   { icon: 'fa-circle-xmark',           title: 'Pendaftaran Gagal', btn: 'Coba Lagi', btnIcon: 'fa-rotate-right' },
      success: { icon: 'fa-circle-check',           title: 'Berhasil',          btn: 'Lanjut',    btnIcon: 'fa-arrow-right' },
      warning: { icon: 'fa-triangle-exclamation',   title: 'Peringatan',        btn: 'Mengerti',  btnIcon: 'fa-check' },
      info:    { icon: 'fa-circle-info',            title: 'Informasi',         btn: 'OK',        btnIcon: 'fa-check' },
      loading: { icon: 'fa-circle-notch',           title: 'Memproses',         btn: 'Tunggu',    btnIcon: 'fa-spinner fa-spin' }
    };
    function _normalizeMsgType(t) {
      var map = { err: 'error', ok: 'success', error: 'error', success: 'success', warning: 'warning', info: 'info', loading: 'loading' };
      return map[t] || 'info';
    }
    function showRegMsg(type, message) {
      var box = document.getElementById('regMsg');
      if (!box) return;
      type = _normalizeMsgType(type);
      var m = REG_MSG_META[type] || REG_MSG_META.info;
      var icon = document.getElementById('regMsgIcon');
      var txt = document.getElementById('regMsgText');
      var titleEl = document.getElementById('regMsgTitle');
      var btn = box.querySelector('.modal-btn');
      if (icon) icon.className = 'fas ' + m.icon;
      if (txt) txt.textContent = message;
      if (titleEl) titleEl.textContent = m.title;
      if (btn) btn.innerHTML = '<i class="fas ' + m.btnIcon + '"></i> ' + m.btn;
      var card = box.querySelector('.modal-card');
      if (card) card.className = 'modal-card alert-' + type;
      box.classList.remove('show');
      requestAnimationFrame(function() { box.classList.add('show'); });
    }
    /* ===== MODAL CLOSE HANDLER (overlay background click / [data-close] click) ===== */
    (function setupRegMsgCloseHandler() {
      var box = document.getElementById('regMsg');
      if (!box) return;
      box.addEventListener('click', function(e) {
        if (e.target === box || e.target.closest('[data-close]')) {
          box.classList.remove('show');
        }
      });
    })();

    async function doRegister(e) {
      e.preventDefault();
      const msg = document.getElementById('regMsg');
      const btn = document.getElementById('regBtn');
      msg.classList.remove('show');

      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mendaftar...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('regUsername').value.trim(),
            password: document.getElementById('regPassword').value
          })
        });
        const data = await res.json();

        if (data.success) {
          if (data.pending) {
            showRegMsg('ok', 'Pendaftaran berhasil! Akun Anda menunggu persetujuan admin.');
          } else {
            showRegMsg('ok', 'Pendaftaran berhasil! Mengalihkan ke login...');
            setTimeout(() => window.location.href = '/Login.html', 2000);
          }
        } else {
          showRegMsg('err', data.error || 'Pendaftaran gagal!');
        }
      } catch (err) {
        showRegMsg('err', 'Kesalahan koneksi ke server');
      } finally {
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Daftar Sekarang';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
